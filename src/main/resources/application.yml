spring:
  application:
    name: instagram-facebook-chatbot-saas
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/chatbot_saas}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

meta:
  app:
    id: ${META_APP_ID:}
    secret: ${META_APP_SECRET:}
  graph:
    api:
      version: ${META_GRAPH_API_VERSION:v23.0}
      url: ${META_GRAPH_API_URL:https://graph.facebook.com/${meta.graph.api.version}}
  oauth:
    redirect-uri: ${BASE_URL:http://localhost:8080}/api/auth/meta/callback
    # pages_manage_metadata is required to subscribe the Page to our webhook
    scopes: ${META_OAUTH_SCOPES:pages_show_list,pages_messaging,pages_manage_metadata,instagram_basic,instagram_manage_messages}

webhook:
  verify-token: ${WEBHOOK_VERIFY_TOKEN:verify_token}

directus:
  public-url: ${DIRECTUS_PUBLIC_URL:}

admin:
  username: ${ADMIN_USERNAME:admin}
  password: ${ADMIN_PASSWORD:change_me_before_deploying}

oauth:
  state-secret: ${OAUTH_STATE_SECRET:0123456789abcdef0123456789abcdef}
  state-ttl-minutes: ${OAUTH_STATE_TTL_MINUTES:60}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

encryption:
  secret-key: ${ENCRYPTION_SECRET_KEY:0123456789abcdef0123456789abcdef}

logging:
  level:
    com.chatbot.saas: DEBUG
