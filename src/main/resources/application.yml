spring:
  application:
    name: instagram-facebook-chatbot-saas
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/chatbot_saas}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
  flyway:
    enabled: true
    # db/postgres holds PostgreSQL-only migrations (e.g. Directus grants) that H2 tests skip
    locations: classpath:db/migration,classpath:db/postgres
  servlet:
    multipart:
      # Product photo uploads (MediaService allows 5 MB images)
      max-file-size: 6MB
      max-request-size: 6MB
  session:
    jdbc:
      # The tables come from Flyway (V22__spring_session.sql)
      initialize-schema: never
  lifecycle:
    timeout-per-shutdown-phase: 30s
  task:
    execution:
      shutdown:
        # Let in-flight chat messages finish on redeploy instead of dropping them mid-conversation
        await-termination: true
        await-termination-period: 30s

server:
  port: ${PORT:8080}
  shutdown: graceful
  # Trust X-Forwarded-For/-Proto only from proxies in server.tomcat.remoteip.internal-proxies
  # (private networks by default); set to "none" if the app is exposed without a proxy
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:native}
  servlet:
    session:
      # Dashboard sign-in; idle sessions expire after this
      timeout: ${SESSION_TIMEOUT:12h}
      cookie:
        name: SESSION
        http-only: true
        same-site: lax
        # Secure (HTTPS-only) cookies are forced on by application-prod.yml
        secure: ${SESSION_COOKIE_SECURE:false}

meta:
  app:
    id: ${META_APP_ID:}
    secret: ${META_APP_SECRET:}
  graph:
    api:
      version: ${META_GRAPH_API_VERSION:v23.0}
      url: ${META_GRAPH_API_URL:https://graph.facebook.com/${meta.graph.api.version}}
  oauth:
    redirect-uri: ${BASE_URL:http://localhost:8080}/api/auth/meta/callback
    # pages_manage_metadata is required to subscribe the Page to our webhook
    scopes: ${META_OAUTH_SCOPES:pages_show_list,pages_messaging,pages_manage_metadata,instagram_basic,instagram_manage_messages}

webhook:
  verify-token: ${WEBHOOK_VERIFY_TOKEN:verify_token}

chatbot:
  # An unfinished conversation idle this long is abandoned; the customer's next message starts over
  conversation-timeout-hours: ${CHATBOT_CONVERSATION_TIMEOUT_HOURS:24}
  # How long the bot stays silent for a customer after they ask for a person or staff reply
  handoff-timeout-hours: ${CHATBOT_HANDOFF_TIMEOUT_HOURS:12}

qpay:
  # Sandbox by default so development never touches real money; production must use
  # https://merchant.qpay.mn/v2 (enforced under the prod profile). Merchant credentials are
  # per shop, set via PUT /api/businesses/{id}/payments/qpay - there are none here.
  api-url: ${QPAY_API_URL:https://merchant-sandbox.qpay.mn/v2}
  # Where QPay sends payment callbacks (/webhook/qpay/{orderId}); must be reachable from QPay
  callback-base-url: ${BASE_URL:http://localhost:8080}
  # Unpaid invoices younger than this are re-checked with QPay in case a callback was missed
  reconcile-window-hours: ${QPAY_RECONCILE_WINDOW_HOURS:3}
  reconcile-interval-ms: ${QPAY_RECONCILE_INTERVAL_MS:300000}

app:
  # Public URL of the app; dashboard links (invites, password resets) point here
  base-url: ${BASE_URL:http://localhost:8080}

auth:
  # Anyone can create a shop from the dashboard's sign-up page; set false to onboard shops only
  # through the admin API
  signup-enabled: ${SIGNUP_ENABLED:true}
  invite-ttl-hours: ${AUTH_INVITE_TTL_HOURS:72}
  reset-ttl-hours: ${AUTH_RESET_TTL_HOURS:24}

# Shown on the public privacy policy and terms pages (/privacy, /terms) - Meta App Review needs
# them. The prod profile refuses to start without a name and contact email.
legal:
  operator-name: ${LEGAL_OPERATOR_NAME:}
  contact-email: ${LEGAL_CONTACT_EMAIL:}
  address: ${LEGAL_ADDRESS:}

privacy:
  # Chat messages older than this are deleted nightly (orders are kept); 0 keeps them forever
  message-retention-days: ${PRIVACY_MESSAGE_RETENTION_DAYS:365}

directus:
  public-url: ${DIRECTUS_PUBLIC_URL:}

admin:
  username: ${ADMIN_USERNAME:admin}
  password: ${ADMIN_PASSWORD:change_me_before_deploying}

oauth:
  state-secret: ${OAUTH_STATE_SECRET:0123456789abcdef0123456789abcdef}
  state-ttl-minutes: ${OAUTH_STATE_TTL_MINUTES:60}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

encryption:
  secret-key: ${ENCRYPTION_SECRET_KEY:0123456789abcdef0123456789abcdef}

logging:
  level:
    # DEBUG logs customer IDs and message metadata - use it only for troubleshooting
    com.chatbot.saas: ${LOG_LEVEL:INFO}
