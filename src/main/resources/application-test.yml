spring:
  datasource:
    url: jdbc:h2:mem:chatbot_saas_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

meta:
  app:
    id: test_app_id
    secret: test_app_secret

webhook:
  verify-token: test_verify_token

admin:
  username: admin
  password: test_admin_password

oauth:
  state-secret: test_oauth_state_secret_1234567890

encryption:
  secret-key: 0123456789abcdef0123456789abcdef

cors:
  allowed-origins: http://localhost:3000
