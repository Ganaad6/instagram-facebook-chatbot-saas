services:
  postgres:
    image: postgres:15-alpine
    container_name: chatbot_saas_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: chatbot_saas
      POSTGRES_USER: postgres
      # Superuser: only used by the init script below. The app (and Directus, if used) get their own roles.
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in .env}
      APP_DB_USER: chatbot_app
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      # Only needed with the optional Directus service (see below); leave empty otherwise
      DIRECTUS_DB_PASSWORD: ${DIRECTUS_DB_PASSWORD:-}
    ports:
      # Localhost only - reach it from the host for psql/backups, never from the internet
      - "127.0.0.1:5432:5432"
    volumes:
      - chatbot_saas_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chatbot_saas"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: chatbot_saas_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Localhost only: the public reaches the app through Caddy (HTTPS) below
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/chatbot_saas
      DATABASE_USERNAME: chatbot_app
      DATABASE_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      META_APP_ID: ${META_APP_ID}
      META_APP_SECRET: ${META_APP_SECRET}
      BASE_URL: ${BASE_URL:?set BASE_URL in .env (https://your-domain)}
      WEBHOOK_VERIFY_TOKEN: ${WEBHOOK_VERIFY_TOKEN}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-v23.0}
      OAUTH_STATE_TTL_MINUTES: ${OAUTH_STATE_TTL_MINUTES:-60}
      META_OAUTH_SCOPES: ${META_OAUTH_SCOPES:-pages_show_list,pages_messaging,pages_manage_metadata,instagram_basic,instagram_manage_messages}
      CHATBOT_CONVERSATION_TIMEOUT_HOURS: ${CHATBOT_CONVERSATION_TIMEOUT_HOURS:-24}
      CHATBOT_HANDOFF_TIMEOUT_HOURS: ${CHATBOT_HANDOFF_TIMEOUT_HOURS:-12}
      ENCRYPTION_SECRET_KEY: ${ENCRYPTION_SECRET_KEY}
      OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      PORT: 8080
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FORWARD_HEADERS_STRATEGY: ${FORWARD_HEADERS_STRATEGY:-native}
      TZ: ${TZ:-Asia/Ulaanbaatar}
      SIGNUP_ENABLED: ${SIGNUP_ENABLED:-true}
      LEGAL_OPERATOR_NAME: ${LEGAL_OPERATOR_NAME:-}
      LEGAL_CONTACT_EMAIL: ${LEGAL_CONTACT_EMAIL:-}
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:-12h}
      AUTH_INVITE_TTL_HOURS: ${AUTH_INVITE_TTL_HOURS:-72}
      AUTH_RESET_TTL_HOURS: ${AUTH_RESET_TTL_HOURS:-24}
      QPAY_RECONCILE_WINDOW_HOURS: ${QPAY_RECONCILE_WINDOW_HOURS:-3}
      # Only for product photos uploaded through Directus before the dashboard existed
      DIRECTUS_PUBLIC_URL: ${DIRECTUS_PUBLIC_URL:-}
      QPAY_API_URL: ${QPAY_API_URL:-https://merchant-sandbox.qpay.mn/v2}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 5

  # HTTPS reverse proxy with automatic Let's Encrypt certificates - see docker/caddy/Caddyfile
  caddy:
    image: caddy:2-alpine
    container_name: chatbot_saas_caddy
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env (your domain, or localhost to try it locally)}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Legacy, optional: the Directus catalog admin used before the dashboard. Shops now manage
  # products and photos in the dashboard, so this only runs with `--profile directus` - for
  # deployments that still want it. See README.md "Directus (legacy)".
  directus:
    profiles: ["directus"]
    image: directus/directus:11
    container_name: chatbot_saas_directus
    restart: unless-stopped
    depends_on:
      # Wait for the app so its migrations (tables + Directus grants) exist before Directus
      # introspects the schema
      app:
        condition: service_healthy
    ports:
      - "${DIRECTUS_PORT:-8055}:8055"
    environment:
      KEY: ${DIRECTUS_KEY:-}
      SECRET: ${DIRECTUS_SECRET:-}
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: chatbot_saas
      DB_USER: directus
      DB_PASSWORD: ${DIRECTUS_DB_PASSWORD:-}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD}
      PUBLIC_URL: ${DIRECTUS_PUBLIC_URL:-http://localhost:8055}
    volumes:
      - directus_uploads:/directus/uploads

volumes:
  chatbot_saas_pgdata:
  caddy_data:
  caddy_config:
  directus_uploads:
