version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: chatbot_saas_db
    environment:
      POSTGRES_DB: chatbot_saas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - chatbot_saas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chatbot_saas"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: chatbot_saas_app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/chatbot_saas
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: password
      META_APP_ID: ${META_APP_ID}
      META_APP_SECRET: ${META_APP_SECRET}
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      WEBHOOK_VERIFY_TOKEN: ${WEBHOOK_VERIFY_TOKEN}
      ENCRYPTION_SECRET_KEY: ${ENCRYPTION_SECRET_KEY}
      OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      PORT: 8080
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}

volumes:
  chatbot_saas_pgdata:
